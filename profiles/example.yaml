# Example profile for CopperArch-Linux-Media.
# Copy to my-profile.yaml, fill in, then:
#   python3 install.py --cli --profile my-profile.yaml
#
# A profile carries your CHOICES, not installer logic. Secrets live here too
# (chmod 600) — treat the file like a password, or leave secrets blank and
# answer the prompts at install time instead.

meta:
  installer: CopperArch-Linux-Media

user: yourname
lan_ip: 192.168.1.50
lan_cidr: 192.168.1.0/24
host_ip: ""          # Plex advertise IP; blank = lan_ip

domain: ""           # e.g. example.org (blank skips the public domains)
jellyfin_public_url: ""
nextcloud_domain: ""
immich_domain: ""
duckdns_domains: ""  # e.g. myname,mynameplex,mynameseerr (3rd/seerr slot optional)
duckdns_token: ""

media_pool: /mnt/storage
nextcloud_data: /mnt/nextcloud-data
media_disks: []      # extra mount paths to verify, e.g. [/mnt/server-disk1]

# VPN — any provider gluetun supports: airvpn, cyberghost, expressvpn,
# fastestvpn, giganews, hidemyass, ipvanish, ivpn, mullvad, nordvpn,
# "perfect privacy", privado, "private internet access", privatevpn, protonvpn,
# purevpn, slickvpn, surfshark, torguard, vpnsecure, "vpn unlimited", vyprvpn,
# windscribe — or `custom` for your own server / an unlisted provider.
vpn_provider: surfshark
vpn_type: openvpn            # openvpn | wireguard
vpn_name: ""                 # dashboard label; blank = the provider's name
# OpenVPN: your provider's service credentials
vpn_user: ""
vpn_password: ""
vpn_openvpn_config: ""       # custom + openvpn only: path to your .ovpn file
# WireGuard: from the config your provider (or your own server) gives you
vpn_wg_private_key: ""
vpn_wg_addresses: ""         # e.g. 10.64.222.21/32
vpn_wg_preshared_key: ""     # optional
vpn_wg_public_key: ""        # custom only: the server's public key
vpn_wg_endpoint_ip: ""       # custom only: the server's IP address
vpn_wg_endpoint_port: "51820"
vpn_server_countries: Netherlands   # not used with `custom`
vpn_rotate_hourly: true

use_media_stack: true
use_vpn_stack: true
use_dashboard: true
use_daily_routine: true
use_post_reboot_check: true
use_duckdns: false
use_wastebins: true
use_alerts: false
use_local_glm: false   # true = install Ollama + GLM on this machine
glm_model: auto        # auto | glm-4.7-flash | glm4:9b

# secrets — blank fields are generated on a fresh install
nc_db_password: ""
nc_admin_password: ""
immich_db_password: ""
plex_claim: ""       # from plex.tv/claim
tugtainer_secret: ""
qbit_user: admin
qbit_password: ""
vnc_pw: ""
openrouter_api_key: ""

smtp_host: ""
smtp_port: "587"
smtp_user: ""
smtp_pass: ""
mail_from: ""
mail_to: ""
